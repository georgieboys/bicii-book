# BICII Admin CI (docs/TESTING.md "CI").
#
#   check  npm ci, typecheck + eslint + prettier, colour contrast, and a
#          type-drift check: regenerate src/lib/database.types.ts from a
#          throwaway database built from supabase/migrations and fail on diff.
#   test   unit + db Vitest projects against a Postgres 16 service container,
#          with the real Supabase Auth/PostgREST/Storage from the devstack
#          (so the live-stack smoke test runs too).
#   build  next build with placeholder public env.
#
# These three should be the required checks on `main` (RUNBOOK "CI"; branch
# protection is the owner's setting). migrate.yml applies migrations to
# production only after this workflow succeeds for a push to `main`. Playwright
# lives in e2e.yml: this workflow never runs on `labeled`, because a run
# triggered by a label would post SKIPPED `check`/`test`/`build` check runs
# on the head commit, and GitHub counts a skipped required check as passing,
# which could make a PR with a failed test mergeable.
#
# No Docker beyond the Postgres service container, and no secrets: the
# devstack uses the well-known Supabase local demo JWT secret and keys.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Every devstack script, the DB test harness and Playwright read the libpq
  # variables (DATABASE_URL would win; it is deliberately unset). The user
  # must be a superuser: the scripts create databases and the platform roles.
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGUSER: postgres
  PGPASSWORD: postgres
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          devstack: "true"
      - name: Typecheck, lint, format
        run: npm run check
      - name: Colour contrast (WCAG AA)
        run: npm run tokens:contrast
      - name: Generated database types match the migrations
        run: |
          if ! npm run check:types; then
            echo "::error file=src/lib/database.types.ts::Out of date. Run 'npm run db:types' after changing supabase/migrations and commit the result."
            exit 1
          fi

  test:
    name: test (unit + db)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
        with:
          devstack: "true"
      # The db project builds its own template database; the dev database
      # and running services are only for the live-stack smoke test.
      - name: Build bicii_dev and start the devstack
        run: |
          npm run db:reset
          npm run devstack:start
      - name: Unit and database tests
        run: npm test
        env:
          # The smoke test fails instead of skipping if the stack is down.
          BICII_REQUIRE_STACK: "1"
      - name: Devstack logs
        if: failure()
        run: tail -n 200 .devstack/logs/*.log || true

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare
      - name: next build
        run: npm run build
        env:
          # Placeholders: env is parsed lazily, so the build never contacts them.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_PUBLIC_SITE_URL: https://bicii.example
